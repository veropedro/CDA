<!DOCTYPE html>
<html>
<head>
    <title>formulaire absence</title>
    <link rel="stylesheet" href="styleForm2.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    <div id="haut-page">
        <h1> Autorisation d'Absence </h1>
        <img src="logoAfpa.jpeg" alt="Logo AFPA" />
    </div> 
    <div id="formulaire1">
    <!-- NOM / PRÉNOM -->
        <div class="champ">
            <label>Nom : </label>
                <input type="text">

            <br><br>            <!---saut a la ligne!--->

            <label>Prénom : </label>
                <input type="text">
        </div>
  
        <!-- Formation suivie -->
        <div class="champ">
            <span class="label">Formation suivie :</span>
            <input type="text" class="long" placeholder="_________________________________________________________________">
        </div>

        <!-- Texte bleu -->
        <div class="champ">
            <span class="demande">Demande l’autorisation de s’absenter du centre :</span>
        </div>

        <!-- Dates -->
        <div class="champ">
            <span>Le</span>
            <input type="text" class="date" placeholder="____________________________________________">

            <span style="margin-left:150px;">ou</span>

            <span style="margin-left:50px;">Du</span>
            <input type="text" class="date" placeholder="___________________">
            <span>au</span>
            <input type="text" class="date" placeholder="___________________">
        </div>

        <!-- Heures -->
        <div class="champ">
            <span>De</span>
            <input type="text" class="heure" placeholder="___________________">
            <span>h à</span>
            <input type="text" class="heure" placeholder="___________________">
            <span>h</span>
            <span style="margin-left:170px;">Soit</span>
            <input type="text" class="heure" placeholder="___________________">
            <span class="jours">jours complets</span>
        </div>
    </div>
