<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>premier exemple</title>
    <style>
        body {
            background-image: url("C:/Users/USER/Desktop/CDA/HTML/afpa.gif");
            background-repeat: repeat;
            background-size: 150px; /* ajuste la taille du logo */
            font-family: Arial, sans-serif;
            text-align: center;
            }
        /* Titre AFPA en haut à gauche */
        #titre-gauche {
            position: absolute;
            top: 10px;
            left: 10px;
            margin: 0;
            font-weight: bold;
        }

        /* Titre principal centré */
        h1 {
            margin-top: 150px; /* descend BIENVENUE comme sur l'image */
            font-size: 48px;
            font-weight: bold;
        }

        /* Sous-titre */
        #centre-page {
            position: absolute;
            font-size: 30px;
            top: 50%;                 /* milieu vertical */
            left: 50%;                /* milieu horizontal */
            transform: translate(-50%, -50%); /* recentre parfaitement */
            text-align: center;
        }
    

        #bas-page {
            position: absolute;
            bottom: 20px;   /* distance par rapport à en bas */
            left: 50%;
            transform: translateX(-50%);
            width: 80%;     /* largeur contrôlée */
            text-align: left;
            font-size: 20px;
        }
    </style>

</head>
<body>
    <!-- Titre placé en haut à gauche -->
    <h1 id="titre-gauche">AFPA</h1>
    <div id="centre-page">
    <h2>BIENVENUE</h2>
    <h3>Sur le "ouèbe" des développeurs</h3>
    </div>

    <div id="bas-page">
    <p>Bienvenue sur le site des développeurs de l’AFPA</p>
    <p>Vous trouverez ici toutes les informations nécessaires au déroulement de votre formation.</p>
    </div>

</body>
</html>
