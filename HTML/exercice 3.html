<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>deuxiemme exemple</title>
    <style> 
        body {
            text-align: left; /* centre les images */
            font-family: Arial, sans-serif;
        }
        img {
            margin: 20px; /* espace autour des images */
            border: 2px solid #000; /* bordure facultative */
        }
    </style>
</head>
<body>
    
    <!-- Image locale -->
    <h2>Image locale</h2>
    <img src="obelix.gif" alt="Obélix" width="200">

    <hr> <!-- TRAIT DE SÉPARATION -->

    <!-- Image distante -->
    <h2>Image distante</h2>
    <img src="http://www.asterix.com/asterix-de-a-a-z/les-personnages/perso/g09b.gif" 
         alt="Astérix" width="200">

</body>
</html>
