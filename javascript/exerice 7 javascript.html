<!DOCTYPE html>
<html lang="fr">
<head>
<title>Utilisation d'un test logique</title>
<meta charset="UTF-8">
<script type="text/javascript">

// 2. Création du tableau
let tab = [-2, 1, 4];

// 3. Fonction soustrait
function soustrait(x) {
    if (x >= 0) {
        return x - 2; // si positif ou nul, on soustrait 2
    } else {
        return "Nombre négatif!"; // sinon message
    }
}

// 4. Fonction affiche
function affiche() {
    // Premier élément
    alert(soustrait(tab[0]));

    // Dernier élément
    alert(soustrait(tab[tab.length - 1]));
}

</script>
</head>
<body>
<h1>Utilisation d'un test logique</h1>
<p>
Cliquez sur le bouton pour lancer la fonction : 
<button onclick="affiche()">Lancer la fonction</button>
</p>
</body>
</html>
