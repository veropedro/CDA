<html>
<head>
<title>Écriture d'une fonction renvoyant une valeur</title>
<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
<script type="text/javascript">

function surfaceCercle() {
  // Demander la saisie du rayon
  let rayon = prompt("Entrez le rayon du cercle :");

  // Calcul de la surface : π * r²
  let surface = Math.PI * rayon * rayon;

  // Retourner le résultat
  return surface;
}

function afficherResultat() {
  // Appel de la fonction qui calcule la surface
  let resultat = surfaceCercle();

  // Affichage
  alert("La surface du cercle est : " + resultat);
}

</script>
</head>
<body>
<h1>Écriture d'une fonction renvoyant une valeur</h1>
<p>Cliquez sur le bouton pour lancer la fonction :
  <button onclick="afficherResultat()">Lancer la fonction</button>
</p>
</body>
</html>
